<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Design Hub Payment</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap">
    <style>
        /* General page styling */
        body {
            font-family: 'Montserrat', sans-serif !important;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            margin: 0;
        }

        /* Main container for the payment form */
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 448px;
            /* max-w-sm */
            width: 100%;
        }

        /* Header styling */
        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
        }

        .logo-svg {
            height: 3rem;
            /* h-12 */
            width: 3rem;
            /* w-12 */
            color: #2563eb;
            /* text-blue-600 */
            margin-right: 0.5rem;
        }

        .logo-text {
            font-size: 1.875rem;
            /* text-3xl */
            font-weight: 700;
            /* font-bold */
            color: #1f2937;
            /* text-gray-800 */
        }

        .logo-subtext {
            font-weight: 300;
            /* font-light */
        }

        /* Main content sections */
        .section-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .secure-payment-info {
            background-color: #eff6ff;
            /* bg-blue-50 */
            padding: 1rem;
            border-radius: 0.75rem;
            /* rounded-xl */
            display: flex;
            align-items: center;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        .secure-payment-svg {
            height: 1.5rem;
            width: 1.5rem;
            color: #2563eb;
            margin-right: 0.75rem;
        }

        .secure-payment-text {
            color: #1f2937;
            font-weight: 600;
            font-size: 1.125rem;
        }

        .payment-details {
            background-color: #f9fafb;
            /* bg-gray-50 */
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            margin-top: 15px;
        }

        .payment-amount {
            color: #374151;
            /* text-gray-700 */
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .payment-amount-bold {
            font-weight: 700;
            /* font-bold */
            font-size: 1.25rem;
            /* text-xl */
        }

        .payment-to-label {
            font-size: 0.875rem;
            /* text-sm */
            color: #6b7280;
            margin-bottom: -10px;
            margin-top: 20px;
            /* text-gray-500 */
        }

        .payment-to-name {
            font-size: 1rem;
            /* text-base */
            color: #374151;
            font-weight: 600;
        }

        /* Form styling */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .relative {
            position: relative;
            min-width: 100%;
        }

        /* Floating label styles */
        .floating-label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            /* text-gray-500 */
            font-size: 0.875rem;
            transition: all 0.2s ease-in-out;
            pointer-events: none;
            cursor: text;
        }

        .floating-label.active {
            top: 0.5rem;
            font-size: 0.75rem;
            color: #2563eb;
            transform: translateY(0);
        }

        .input-field {
            width: 92%;
            padding: 1.5rem 1rem 0.5rem;
            /* pt-6 pb-2 */
            border: 2px solid #d1d5db;
            /* border-gray-300 */
            border-radius: 0.5rem;
            /* rounded-lg */
            outline: none;
            transition: all 0.2s;
            color: #1f2937;
        }

        .input-field:focus {
            border-color: #2563eb;
            /* focus:ring-blue-500 */
        }

        .input-field::placeholder {
            color: transparent;
            /* Hide placeholder when floating label is active */
        }

        /* Secure compliance text */
        .secure-compliance {
            font-size: 0.75rem;
            /* text-xs */
            color: #6b7280;
            /* text-gray-500 */
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .secure-compliance-item {
            display: flex;
            align-items: center;
        }

        .secure-compliance-svg {
            height: 1rem;
            width: 1rem;
            color: #22c55e;
            /* text-green-500 */
            margin-right: 0.5rem;
        }

        /* Submit button styling */
        .submit-button {
            width: 100%;
            background-color: #2563eb;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: background-color 0.3s, box-shadow 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }

        .submit-button:hover {
            background-color: #1d4ed8;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Message box styling */
        .message-box {
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            text-align: center;
        }

        .message-success {
            background-color: #dcfce7;
            /* bg-green-100 */
            color: #166534;
            /* text-green-700 */
        }

        .message-error {
            background-color: #fee2e2;
            /* bg-red-100 */
            color: #b91c1c;
            /* text-red-700 */
        }

        /* Footer styling */
        .secure-text {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: -10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .secure-svg {
            height: 1.2rem;
            width: 1.2rem;
            color: #9ca3af;
            display: inline;
            margin-right: 2px;
        }

        .footer-divider {
            border-top: 1px solid #e5e7eb;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }

        .footer-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #6b7280;
            font-size: 0.75rem;
        }

        .footer-security {
            display: flex;
            align-items: center;
        }

        .footer-security-svg {
            height: 1rem;
            width: 1rem;
            margin-right: 0.25rem;
            color: #22c55e;
        }

        .card-images {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 1rem;
            gap: 0.5rem;
        }

        .card-image {
            width: 100%;
            /* height: 1.5rem; */
            border-radius: 0.25rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="./logo.png" alt="Expert Design Hub" width="200px" draggable="false">
                <!-- <svg xmlns="http://www.w3.org/2000/svg" class="logo-svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <h1 class="logo-text">EXPERT <span class="logo-subtext">CODE CRAFT</span></h1> -->
            </div>
        </div>

        <div class="section-container">
            <div class="payment-details">
                <p class="payment-amount">
                    <span id="payment-amount-display" class="payment-amount-bold">$0</span> • Credit / Debit Card
                </p>
                <p class="payment-to-label">Payment to:</p>
                <p class="payment-to-name">Expert Design Hub</p>
            </div>

            <form id="payment-form" class="form-container">
                <div class="relative">
                    <label id="name-label" for="name-input" class="floating-label">Cardholder Name</label>
                    <input type="text" id="name-input" class="input-field" placeholder="Cardholder Name" required>
                </div>

                <div class="secure-compliance">
                    <div class="secure-compliance-item">
                        <svg xmlns="http://www.w3.org/2000/svg" class="secure-compliance-svg" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <span>Secure 256-bit SSL encryption</span>
                    </div>
                    <div class="secure-compliance-item">
                        <svg xmlns="http://www.w3.org/2000/svg" class="secure-compliance-svg" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <span>PCI DSS compliant</span>
                    </div>
                </div>

                <button id="pay-button" type="submit" class="submit-button">Pay $0 Now</button>

                <div id="message-container"></div>

                <p class="secure-text">
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="secure-svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </span>
                    Your payment information is secure. We don't store your card details.
                </p>
            </form>

            <div class="footer-content">
                <div class="card-images">
                    <img src="./checkout.png" alt="Footer" class="card-image" draggable="false" />
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Get all necessary elements from the DOM
                const nameInput = document.getElementById('name-input');
                const nameLabel = document.getElementById('name-label');
                const paymentForm = document.getElementById('payment-form');
                const payButton = document.getElementById('pay-button');
                const amountDisplay = document.getElementById('payment-amount-display');
                const messageContainer = document.getElementById('message-container');

                let amount = 0;
                let gateway = '';

                // Function to parse URL parameters and update the UI
                const params = new URLSearchParams(window.location.search);
                const urlAmount = params.get('amount');
                const urlGateway = params.get('gateway');

                if (urlAmount) {
                    amount = parseInt(urlAmount, 10);
                    amountDisplay.textContent = `$${amount}`;
                    payButton.textContent = `Pay $${amount} Now`;
                    payButton.disabled = false;
                } else {
                    // If amount is not in the URL, disable the button to prevent an invalid transaction
                    payButton.disabled = true;
                }

                if (urlGateway) {
                    gateway = urlGateway;
                }

                // Floating label logic
                const updateLabel = () => {
                    // Add or remove the 'active' class based on whether the input has a value
                    if (nameInput.value.length > 0) {
                        nameLabel.classList.add('active');
                    } else {
                        nameLabel.classList.remove('active');
                    }
                };

                nameInput.addEventListener('input', updateLabel);
                nameInput.addEventListener('focus', () => {
                    nameLabel.classList.add('active');
                });
                nameInput.addEventListener('blur', () => {
                    if (nameInput.value === '') {
                        nameLabel.classList.remove('active');
                    }
                });

                // Add initial check on page load in case the input is pre-filled
                updateLabel();

                // Form submission logic
                paymentForm.addEventListener('submit', async (event) => {
                    event.preventDefault(); // Prevent the default form submission behavior

                    // Disable the button and show a processing message
                    payButton.disabled = true;
                    payButton.textContent = 'Processing...';
                    messageContainer.innerHTML = ''; // Clear previous messages

                    const name = nameInput.value;
                    const purposeParam = params.get('purpose') || params.get('description') || '';

                    try {
                        const api_end_point = 'https://api.expertdesignhub.com';
                        const response = await fetch(`${api_end_point}/noAuth/edh/create-checkout-session`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                name,
                                amount,
                                gateway,
                                purpose: purposeParam,
                                description: purposeParam,
                                purpose_of_payment: purposeParam,
                                purposeOfPayment: purposeParam,
                                source: 'EDH'
                            }),
                        });

                        const result = await response.json();

                        if (response.ok && result.redirectUrl) {
                            window.location.href = result.redirectUrl;
                        } else {
                            const messageBox = document.createElement('div');
                            messageBox.classList.add('message-box', 'message-error');
                            console.log(result)
                            messageBox.textContent = `Error: ${result.message || 'Something went wrong.'}`;
                            messageContainer.appendChild(messageBox);
                        }

                    } catch (error) {
                        // Handle network or server errors
                        console.error('Error:', error);
                        const messageBox = document.createElement('div');
                        messageBox.classList.add('message-box', 'message-error');
                        messageBox.textContent = 'Failed to connect to the server.';
                        messageContainer.appendChild(messageBox);
                    } finally {
                        // Re-enable the button after the request is complete, unless a redirect is happening
                        payButton.disabled = false;
                        payButton.textContent = `Pay $${amount} Now`;
                    }
                });
            });
        </script>
</body>

</html>
